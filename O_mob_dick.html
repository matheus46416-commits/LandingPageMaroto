    <h1>O Moby Dick</h1>
    <h2>Moby-Dick é um romance publicado em 1851 pelo escritor estadunidense Herman Melville.
        No livro, Ishmael narra a busca obsessiva de Ahab, capitão do navio baleeiro Pequod, por Moby Dick, o gigante cachalote branco que, na viagem anterior do navio, arrancara parte da perna do capitão.</h2>
